<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Placement Portal - Login</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 250px);
            padding: 20px 0;
        }
j
        .login-title {
            color: #0b3d6d;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .card {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group h4 {
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            height: 45px;
            background: blue;
            color: white;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0b3d6d;
        }

        #error {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>

    <script>
        function validateLogin() {

            const username = document.getElementById("studentname").value.trim();
            const password = document.getElementById("password").value.trim();
            const error = document.getElementById("error");

            const validUsername = "anits";
            const validPassword = "1234";

            error.textContent = "";

            if (username === "") {
                error.textContent = "Username is required";
                return false;
            }

            if (password === "") {
                error.textContent = "Password is required";
                return false;
            }

            if (username === validUsername && password === validPassword) {

                alert("Login Successful!");

                window.location.href = "success.html";

                return false;
            }

            error.textContent = "Invalid Username or Password!";
            return false;
        }
    </script>

</head>

<body>

<header>
    <div class="logo-section">
        <img src="logo.jpeg" width="80" height="80">
        <div class="title">
            <h1>ANIL NEERUKONDA INSTITUTE OF TECHNOLOGY AND SCIENCES</h1>
            <h2>Campus Placement Portal</h2>
        </div>
    </div>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="companies.html">Companies</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<main class="login-container">

    <h2 class="login-title">Student Login</h2>

    <article class="card">

        <form onsubmit="return validateLogin()">

            <div id="error"></div>

            <div class="form-group">
                <h4>Username</h4>
                <input type="text" id="studentname" placeholder="Enter Username">
            </div>

            <div class="form-group">
                <h4>Password</h4>
                <input type="password" id="password" placeholder="Enter Password">
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

    </article>

</main>

<footer>
    <h3>© 2026 ANITS | Department of Training & Placement</h3>
    <p>Sangivalasa, Visakhapatnam, Andhra Pradesh</p>
</footer>

</body>
</html>
