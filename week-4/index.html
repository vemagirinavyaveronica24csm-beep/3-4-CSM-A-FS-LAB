<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANITS - Central Placement Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            /* Background gradient matching the reference picture */
            background: radial-gradient(circle, #4a6274 0%, #1d2b36 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* Glassmorphism Login Box */
        .login-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 30px 40px;
            width: 320px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        .login-box h2 {
            color: #4a90e2;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #dcdcdc;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.85);
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 4px;
            background-color: #3b70a2;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .login-btn:hover {
            background-color: #2c547a;
        }

        #error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <h1>ANITS - Central Placement Portal</h1>

    <div class="login-box">
        <h2>User Login</h2>
        <form onsubmit="return validatelogin()">
            <div class="input-group">
                <label for="studentname">Username</label>
                <input type="text" id="studentname" placeholder="Enter Username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password">
            </div>

            <p id="error"></p>

            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <!-- Ensure script file is properly attached -->
    <script src="script.js"></script>
</body>
</html>
